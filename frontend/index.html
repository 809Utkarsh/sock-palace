<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c140f" />
    <title>Sock Palace | Official Store</title>
    <meta name="description" content="Bold socks for every day. Crew, ankle, knee-high and gift packs." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // After a new deploy, a tab opened earlier may request old /assets/ files that no longer
      // exist. Instead of leaving a blank page, reload once to pick up the new version.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
        if (t.src ? t.src.indexOf('/assets/') === -1 : (t.href || '').indexOf('/assets/') === -1) return;
        try {
          if (sessionStorage.getItem('assetReload')) return;
          sessionStorage.setItem('assetReload', '1');
        } catch (_) {}
        location.reload();
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () { try { sessionStorage.removeItem('assetReload'); } catch (_) {} }, 5000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
